<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>أنت غير متصل بالإنترنت - ASU Med Materials</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#059669" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #fafafa;
        color: #18181b;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        box-sizing: border-box;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #09090b;
          color: #f4f4f5;
        }
      }
      .card {
        background: white;
        border: 1px solid #e4e4e7;
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        max-width: 24rem;
        width: 100%;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      }
      @media (prefers-color-scheme: dark) {
        .card {
          background: #18181b;
          border-color: #27272a;
        }
      }
      .icon-box {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
        background: #ecfdf5;
        color: #059669;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
      }
      @media (prefers-color-scheme: dark) {
        .icon-box {
          background: rgba(6, 78, 59, 0.3);
          color: #34d399;
        }
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 800;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.875rem;
        color: #71717a;
        margin: 0 0 1.5rem;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #a1a1aa;
        }
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: #059669;
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.875rem;
        box-sizing: border-box;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #047857;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">
        <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
        </svg>
      </div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>يمكنك تصفح الصفحات والمصادر المحفوظة مسبقاً من خلال العودة للصفحة الرئيسية.</p>
      <a href="/" class="btn">الانتقال للصفحة الرئيسية</a>
    </div>
  </body>
</html>
